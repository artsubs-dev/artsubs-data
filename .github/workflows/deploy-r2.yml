name: Deploy Data ke R2

on:
  push:
    branches: [main]
    paths: ["data/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload ke R2 (S3 API)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 sync data/ "s3://$BUCKET/data/" --delete \
            --endpoint-url "$ENDPOINT" \
            --content-type "application/json" \
            --cache-control "public, max-age=0, must-revalidate"

      # TAMBAHAN: Tembak revalidate ke Vercel tepat setelah R2 selesai upload
      - name: Revalidate Vercel
        env:
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_SECRET" ]; then
            curl -s -X POST "https://katalog.artsubs.co/api/revalidate" \
              -H "x-revalidate-secret: $REVALIDATE_SECRET" \
              -H "Content-Type: application/json" \
              -d '{"path": "/"}'
          fi
